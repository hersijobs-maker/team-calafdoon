<!doctype html>
<html lang="so">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#059669" />
    <meta name="description" content="Team Calafdoon — Isku Xir Qoyas Farxad Leh. Hel qofka kugu habboon." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calafdoon" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:title" content="Team Calafdoon" />
    <meta property="og:description" content="Isku Xir Qoyas Farxad Leh — Hel Qofka Kugu Habboon" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <title>Team Calafdoon</title>
    <style>
      .app-loading{position:fixed;inset:0;background:#059669;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
      .app-loading-icon{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
      .app-loading-icon::after{content:'';width:32px;height:32px;border-radius:8px;background:#fff;opacity:.9}
      .app-loading-text{color:#fff;font-weight:700;font-size:18px;margin:0}
      .app-loading-spinner{margin-top:18px;width:24px;height:24px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:alspin .8s linear infinite}
      @keyframes alspin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div class="app-loading" id="app-loading">
      <div class="app-loading-icon"></div>
      <p class="app-loading-text">Team Calafdoon</p>
      <div class="app-loading-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
